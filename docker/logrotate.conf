/logs/dnsmasq.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 dnsmasq dnsmasq
    sharedscripts
    postrotate
        if [ -f /var/run/dnsmasq.pid ]; then
            kill -USR2 "$(cat /var/run/dnsmasq.pid)" 2>/dev/null || true
        else
            # Fallback – dnsmasq is PID 1
            kill -USR2 1 2>/dev/null || true
        fi
    endscript
}
