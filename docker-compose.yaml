services:
  app:
    build: ./docker
    container_name: dnsmasq
    image: ${IMAGE_NAME:-dnsmasq}
    restart: always
    ports:
      - "${IP}:53:5353/udp"
      - "${IP}:53:5353/tcp"
    volumes:
      - ./volumes/config/hosts:/dnsmasq.hosts/hosts
      - ./volumes/logs:/logs
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    environment:
      - LOCAL_DNS_TTL
      - HOST_USER_ID
      - HOST_GROUP_ID

